services:
  postgres:
    image: postgres:16
    container_name: gomly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gomly
      POSTGRES_PASSWORD: gomly_dev_password
      POSTGRES_DB: gomly
    ports:
      - "5432:5432"
    volumes:
      - gomly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomly -d gomly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: gomly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gomly-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gomly-pgdata:
  gomly-redisdata:
